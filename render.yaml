services:
  - type: web
    name: palacio-instrumental
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Fallback de SPA: Render sólo aplica la regla cuando no existe un
      # archivo en la ruta pedida, así que /assets/* y /logo.png se sirven
      # tal cual y /pipeline o /inventario devuelven index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
